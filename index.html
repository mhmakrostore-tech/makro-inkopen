<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c38"><link rel="manifest" href="manifest.json"><title>Makro Inkopen</title><style>:root{font-family:Arial,sans-serif;color:#172c2a;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}header{background:#123c38;color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}main{max-width:1050px;margin:20px auto;padding:0 14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button,.btn{border:0;border-radius:8px;padding:11px 14px;background:#146b60;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e1eae7;color:#123c38}button.danger{background:#a73535}button:disabled{opacity:.45}section,.panel{background:white;border:1px solid #dce5e1;border-radius:12px;padding:17px;margin-bottom:13px}h2{margin:0 0 15px;font-size:20px}h3{margin:12px 0}label{display:block;font-size:13px;font-weight:bold;margin:9px 0 4px}input,select,textarea{padding:11px;width:100%;border:1px solid #b7c9c3;border-radius:7px;font-size:16px;background:white}input[type=checkbox]{width:21px;height:21px}textarea{min-height:80px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.muted{color:#667b74;font-size:13px}.item{border-bottom:1px solid #e1e8e5;padding:12px 0;display:flex;gap:10px;align-items:center}.item:last-child{border:0}.item .name{flex:1;min-width:120px}.item .qty{width:88px}.notice{background:#fff5d7;border-left:4px solid #c28a12;padding:12px;margin:10px 0;border-radius:5px}.good{background:#e1f3e8;border-left-color:#27935d}.hidden{display:none!important}.pill{font-size:12px;padding:4px 8px;border-radius:12px;background:#e5f0eb}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.order{border:1px solid #dce5e1;padding:12px;border-radius:8px;margin-bottom:10px}video{max-width:100%;width:350px}small{font-size:12px}@media(max-width:540px){header{padding:13px}h1{font-size:19px}.item{flex-wrap:wrap}.item .name{flex-basis:70%}.item .qty{width:95px}}</style></head><body><header><h1>MAKRO INKOPEN</h1><span>📦</span></header><main><nav><button onclick="tab('order')">Bestellen</button><button class="secondary" onclick="tab('products')">Producten</button><button class="secondary" onclick="tab('suppliers')">Leveranciers</button><button class="secondary" onclick="tab('history')">Geschiedenis</button><button class="secondary" onclick="tab('backup')">Back-up</button></nav><div id="app"></div></main><script>
const KEY='makro_inkopen_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};db=db||{suppliers:[],products:[],promos:[],orders:[],drafts:{}};let view='order',supplier='',editProduct='',editPromo='',cameraStream=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(){return document.getElementById('app')}function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function supplierOptions(selected){return db.suppliers.map(s=>`<option value="${esc(s.id)}" ${selected===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}function tab(v){view=v;editProduct='';editPromo='';stopCamera();render()}function setSupplier(v){supplier=v;render()}function current(){return db.suppliers.find(x=>x.id===supplier)}function draft(){return db.drafts[supplier]||(db.drafts[supplier]={date:today(),quantities:{},notes:''})}function chosen(){let d=draft();return db.products.filter(p=>p.supplier===supplier&&(Number(d.quantities[p.id])||0)>0).map(p=>({...p,qty:Number(d.quantities[p.id])}))}function qty(pid,v){draft().quantities[pid]=Math.max(0,Math.floor(Number(v)||0));save();renderOrder(false)}function render(){if(!supplier&&db.suppliers.length)supplier=db.suppliers[0].id;if(!db.suppliers.length&&view==='order')view='suppliers';({order:renderOrder,products:renderProducts,suppliers:renderSuppliers,history:renderHistory,backup:renderBackup})[view]()}function renderSuppliers(){el().innerHTML=`<section><h2>Leveranciers</h2><form onsubmit="addSupplier(event)" class="row"><input class="grow" id="supplierName" required placeholder="Naam leverancier"><button>Toevoegen</button></form></section><section>${db.suppliers.length?db.suppliers.map(s=>`<div class="item"><strong class="grow">${esc(s.name)}</strong><span class="muted">${db.products.filter(p=>p.supplier===s.id).length} producten</span><button class="secondary" onclick="renameSupplier('${s.id}')">Wijzigen</button><button class="danger" onclick="removeSupplier('${s.id}')">Verwijderen</button></div>`).join(''):'Voeg je eerste leverancier toe.'}</section>`}function addSupplier(e){e.preventDefault();let n=document.getElementById('supplierName').value.trim();if(!n)return;if(db.suppliers.some(x=>x.name.toLowerCase()===n.toLowerCase()))return alert('Leverancier bestaat al');let s={id:id(),name:n};db.suppliers.push(s);supplier=s.id;save();render()}function renameSupplier(i){let s=db.suppliers.find(x=>x.id===i),n=prompt('Nieuwe naam',s.name);if(n&&n.trim()){s.name=n.trim();save();render()}}function removeSupplier(i){if(!confirm('Leverancier en alle bijbehorende producten en acties verwijderen? Bestelgeschiedenis blijft bewaard.'))return;db.suppliers=db.suppliers.filter(x=>x.id!==i);db.products=db.products.filter(x=>x.supplier!==i);db.promos=db.promos.filter(x=>x.supplier!==i);delete db.drafts[i];supplier=db.suppliers[0]?.id||'';save();render()}
function selectSupplier(){return `<label>Leverancier</label><select onchange="setSupplier(this.value)">${supplierOptions(supplier)}</select>`}
function renderProducts(){if(!db.suppliers.length){el().innerHTML='<section>Voeg eerst een leverancier toe.</section>';return}let p=db.products.find(x=>x.id===editProduct)||{};el().innerHTML=`<section><h2>Producten beheren</h2>${selectSupplier()}<h3>${p.id?'Product wijzigen':'Nieuw product'}</h3><form onsubmit="productSave(event)" class="grid"><div><label>Productnaam</label><input id="pn" required value="${esc(p.name||'')}"></div><div><label>Productcode</label><input id="pc" value="${esc(p.code||'')}"></div><div><label>Barcode</label><div class="row"><input id="pb" class="grow" value="${esc(p.barcode||'')}"><button type="button" class="secondary" onclick="scan('pb')">📷 Scan</button></div></div><div><label>Merk (optioneel)</label><input id="brand" value="${esc(p.brand||'')}"></div><div><label>Actiegroep (optioneel)</label><select id="pg"><option value="">Geen</option>${db.promos.filter(x=>x.supplier===supplier).map(a=>`<option value="${esc(a.id)}" ${p.promo===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="row" style="align-items:end"><button>Opslaan</button>${p.id?'<button type="button" class="secondary" onclick="editProduct=\'\';render()">Annuleren</button>':''}</div></form><div id="scanner"></div></section><section><h2>Actiegroepen / gratis CRT</h2><p class="muted">Zet producten van verschillende merken in dezelfde actiegroep om hun CRT samen te tellen.</p><form onsubmit="promoSave(event)" class="grid"><div><label>Naam actie</label><input id="an" required placeholder="Bijv. Mix merken 10+1" value="${esc(db.promos.find(x=>x.id===editPromo)?.name||'')}"></div><div><label>Bij aantal CRT gekocht</label><input type="number" min="1" id="ath" required value="${esc(db.promos.find(x=>x.id===editPromo)?.threshold||10)}"></div><div><label>Gratis CRT</label><input type="number" min="1" id="afree" required value="${esc(db.promos.find(x=>x.id===editPromo)?.free||1)}"></div><div class="row" style="align-items:end"><button>Actie opslaan</button></div></form>${db.promos.filter(x=>x.supplier===supplier).map(a=>`<div class="item"><div class="grow">${esc(a.name)} — ${a.threshold} CRT + ${a.free} gratis</div><button class="secondary" onclick="editPromo='${a.id}';render()">Wijzigen</button><button class="danger" onclick="deletePromo('${a.id}')">Wissen</button></div>`).join('')}</section><section><h2>Productlijst</h2><input id="filter" placeholder="Zoek naam, code of barcode" oninput="filterProducts()"><div id="productlist">${productRows()}</div></section>`}function productRows(){return db.products.filter(x=>x.supplier===supplier).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="item product-row" data-search="${esc((p.name+' '+p.code+' '+p.barcode+' '+p.brand).toLowerCase())}"><div class="name"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.code)} · ${esc(p.barcode)} ${p.brand?'· '+esc(p.brand):''}</div></div><button class="secondary" onclick="editProduct='${p.id}';render()">Wijzigen</button><button class="danger" onclick="deleteProduct('${p.id}')">Wissen</button></div>`).join('')||'<p>Geen producten.</p>'}function filterProducts(){let q=document.getElementById('filter').value.toLowerCase();document.querySelectorAll('.product-row').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}function productSave(e){e.preventDefault();let p=db.products.find(x=>x.id===editProduct);if(!p){p={id:id(),supplier};db.products.push(p)}Object.assign(p,{name:document.getElementById('pn').value.trim(),code:document.getElementById('pc').value.trim(),barcode:document.getElementById('pb').value.trim(),brand:document.getElementById('brand').value.trim(),promo:document.getElementById('pg').value});editProduct='';save();render()}function deleteProduct(i){if(confirm('Product verwijderen?')){db.products=db.products.filter(x=>x.id!==i);save();render()}}function promoSave(e){e.preventDefault();let a=db.promos.find(x=>x.id===editPromo);if(!a){a={id:id(),supplier};db.promos.push(a)}Object.assign(a,{name:document.getElementById('an').value.trim(),threshold:Number(document.getElementById('ath').value),free:Number(document.getElementById('afree').value)});editPromo='';save();render()}function deletePromo(i){if(!confirm('Actie verwijderen?'))return;db.promos=db.promos.filter(x=>x.id!==i);db.products.forEach(p=>{if(p.promo===i)p.promo=''});save();render()}
function renderOrder(full=true){if(!db.suppliers.length)return;let d=draft(),products=db.products.filter(x=>x.supplier===supplier).sort((a,b)=>a.name.localeCompare(b.name));let html=`<section><h2>Nieuwe inkoopbestelling</h2>${selectSupplier()}<div class="grid"><div><label>Besteldatum (zelf invullen)</label><input type="date" value="${esc(d.date)}" onchange="draft().date=this.value;save()"></div><div><label>Zoek product / barcode</label><div class="row"><input id="search" class="grow" placeholder="Naam, code of barcode" oninput="filterOrder()"><button class="secondary" onclick="scan('search')">📷 Scan</button></div></div></div><div id="scanner"></div><div id="orderItems">${products.map(p=>`<div class="item order-row" data-search="${esc((p.name+' '+p.code+' '+p.barcode+' '+p.brand).toLowerCase())}"><input aria-label="Selecteer ${esc(p.name)}" type="checkbox" ${Number(d.quantities[p.id])>0?'checked':''} onchange="qty('${p.id}',this.checked?1:0)"><div class="name"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.brand)} ${p.code?'· Code '+esc(p.code):''} ${p.promo?'· 🎁 Actie':''}</div></div><input class="qty" aria-label="CRT aantal ${esc(p.name)}" type="number" min="0" step="1" value="${Number(d.quantities[p.id])||0}" onchange="qty('${p.id}',this.value)"><strong>CRT</strong></div>`).join('')||'<p>Voeg producten toe bij Producten.</p>'}</div></section><section><h2>Besteloverzicht</h2><div id="summary">${summaryHtml()}</div><label>Notitie voor intern gebruik (niet meesturen)</label><textarea onchange="draft().notes=this.value;save()">${esc(d.notes||'')}</textarea><div class="actions"><button onclick="sendOrder()" ${chosen().length?'':'disabled'}>📤 Bestelling versturen</button><button class="secondary" onclick="saveDraftOrder()" ${chosen().length?'':'disabled'}>Concept bewaren</button><button class="secondary" onclick="copyOrder()" ${chosen().length?'':'disabled'}>Kopieer besteltekst</button><button class="secondary" onclick="clearDraft()">Nieuwe lege bestelling</button></div><p class="muted">Bij versturen opent het deelmenu van je apparaat (bijv. WhatsApp of e-mail). De verzenddatum wordt vastgelegd zodra je bevestigt dat je de bestelling hebt verzonden.</p></section>`;if(full){el().innerHTML=html}else{let old=document.getElementById('search')?.value||'';el().innerHTML=html;let inp=document.getElementById('search');if(inp){inp.value=old;filterOrder()}}}function filterOrder(){let q=document.getElementById('search')?.value.toLowerCase()||'';document.querySelectorAll('.order-row').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}function summaryHtml(){let ps=chosen(),total=ps.reduce((n,p)=>n+p.qty,0);let groups=db.promos.filter(a=>a.supplier===supplier).map(a=>{let count=ps.filter(p=>p.promo===a.id).reduce((n,p)=>n+p.qty,0);let free=Math.floor(count/a.threshold)*a.free;let remaining=count%a.threshold;return count?`<div class="notice ${free?'good':''}"><strong>🎁 ${esc(a.name)}: ${count} CRT</strong><div>${a.threshold} CRT + ${a.free} gratis — <strong>${free} gratis CRT</strong> (leverancier bepaalt welk product)${remaining?`<br>Nog ${a.threshold-remaining} CRT tot de volgende gratis actie.`:''}</div></div>`:''}).join('');return `<strong>${ps.length} producten · ${total} CRT besteld</strong>${groups||''}<div style="margin-top:12px">${ps.map(p=>`<div class="item"><span class="grow">${esc(p.name)}</span><strong>${p.qty} CRT</strong></div>`).join('')||'<p class="muted">Vink producten aan om te bestellen.</p>'}</div>`}function orderText(ps){return ps.map(p=>`${p.name} — ${p.qty} CRT`).join('\n')}function copyOrder(){navigator.clipboard?.writeText(orderText(chosen())).then(()=>alert('Besteltekst gekopieerd')).catch(()=>prompt('Kopieer de bestelling:',orderText(chosen())))}function saveDraftOrder(){let ps=chosen();if(!ps.length)return;db.orders.unshift({id:id(),supplierId:supplier,supplierName:current().name,orderDate:draft().date,createdAt:new Date().toISOString(),status:'concept',items:ps.map(p=>({name:p.name,qty:p.qty,code:p.code})),notes:draft().notes||'',promos:promoSnapshot(ps)});save();alert('Concept opgeslagen in geschiedenis');render()}function promoSnapshot(ps){return db.promos.filter(a=>a.supplier===supplier).map(a=>{let count=ps.filter(p=>p.promo===a.id).reduce((n,p)=>n+p.qty,0);return count?{name:a.name,count,free:Math.floor(count/a.threshold)*a.free}:null}).filter(Boolean)}async function sendOrder(){let ps=chosen();if(!ps.length)return;let order={id:id(),supplierId:supplier,supplierName:current().name,orderDate:draft().date,createdAt:new Date().toISOString(),status:'concept',items:ps.map(p=>({name:p.name,qty:p.qty,code:p.code})),notes:draft().notes||'',promos:promoSnapshot(ps)};db.orders.unshift(order);save();let content=orderText(ps);try{if(navigator.share){await navigator.share({text:content})}else{await navigator.clipboard.writeText(content);alert('Besteltekst gekopieerd. Plak deze in WhatsApp of e-mail.')}}catch(e){if(e.name!=='AbortError')alert('Kopieer de bestelling via de knop.')}let confirmed=confirm('Heb je de bestelling daadwerkelijk verstuurd?\n\nOK = als VERSTUURD bewaren met huidige datum en tijd.\nAnnuleren = als CONCEPT bewaren.');if(confirmed){order.status='sent';order.sentAt=new Date().toISOString();db.drafts[supplier]={date:today(),quantities:{},notes:''}}save();render()}function clearDraft(){if(confirm('Huidige selectie leegmaken?')){db.drafts[supplier]={date:today(),quantities:{},notes:''};save();render()}}
function renderHistory(){el().innerHTML=`<section><h2>Bestelgeschiedenis</h2><div class="grid"><div><label>Leverancier filteren</label><select id="histSup" onchange="historyList()"><option value="">Alle leveranciers</option>${supplierOptions('')}</select></div><div><label>Status</label><select id="histStatus" onchange="historyList()"><option value="">Alle</option><option value="sent">Verstuurd</option><option value="concept">Concept</option></select></div></div></section><section id="historyList"></section>`;historyList()}function historyList(){let s=document.getElementById('histSup').value,status=document.getElementById('histStatus').value;document.getElementById('historyList').innerHTML=db.orders.filter(o=>(!s||o.supplierId===s)&&(!status||o.status===status)).map(o=>`<div class="order"><div class="row"><strong class="grow">${esc(o.supplierName)}</strong><span class="pill">${o.status==='sent'?'Verstuurd':'Concept'}</span></div><div class="muted">Besteldatum: ${esc(o.orderDate||'—')} · Verzenddatum: ${o.sentAt?new Date(o.sentAt).toLocaleString('nl-NL'):'Nog niet verstuurd'}</div><p>${o.items.map(p=>`${esc(p.name)} — ${p.qty} CRT`).join('<br>')}</p>${(o.promos||[]).map(a=>`<div class="notice">${esc(a.name)}: ${a.count} CRT → ${a.free} gratis CRT (leverancier kiest)</div>`).join('')}<div class="actions"><button class="secondary" onclick="repeatOrder('${o.id}')">Opnieuw bestellen</button><button class="secondary" onclick="copyHistory('${o.id}')">Kopieer tekst</button>${o.status==='concept'?`<button onclick="markSent('${o.id}')">Markeer verstuurd</button>`:''}<button class="danger" onclick="deleteOrder('${o.id}')">Verwijderen</button></div></div>`).join('')||'<p>Er zijn nog geen bestellingen.</p>'}function copyHistory(i){let o=db.orders.find(x=>x.id===i);navigator.clipboard?.writeText(orderText(o.items)).then(()=>alert('Gekopieerd')).catch(()=>prompt('Kopieer:',orderText(o.items)))}function markSent(i){if(!confirm('Bevestig dat deze bestelling echt is verstuurd.'))return;let o=db.orders.find(x=>x.id===i);o.status='sent';o.sentAt=new Date().toISOString();save();render()}function repeatOrder(i){let o=db.orders.find(x=>x.id===i);if(!db.suppliers.some(s=>s.id===o.supplierId))return alert('Deze leverancier bestaat niet meer');supplier=o.supplierId;let quantities={};o.items.forEach(item=>{let p=db.products.find(p=>p.supplier===supplier&&p.code&&p.code===item.code)||db.products.find(p=>p.supplier===supplier&&p.name===item.name);if(p)quantities[p.id]=item.qty});db.drafts[supplier]={date:today(),quantities,notes:''};save();tab('order')}function deleteOrder(i){if(confirm('Deze bestelling definitief verwijderen?')){db.orders=db.orders.filter(o=>o.id!==i);save();render()}}
function renderBackup(){el().innerHTML=`<section><h2>Back-up en gegevens</h2><p>De gegevens staan op dit apparaat in deze browser. Maak regelmatig een back-up. Voor automatische synchronisatie tussen PC, telefoon en tablet is later een online database nodig.</p><div class="actions"><button onclick="exportData()">Download back-up (JSON)</button><label class="btn" style="cursor:pointer">Back-up terugzetten<input type="file" accept=".json,application/json" onchange="importData(event)" style="display:none"></label></div><p class="muted">Terugzetten vervangt alle huidige gegevens op dit apparaat.</p></section>`}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='makro-inkopen-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.suppliers)||!Array.isArray(x.products)||!Array.isArray(x.orders)||!Array.isArray(x.promos))throw Error('Ongeldig bestand');if(!confirm('Alle huidige gegevens vervangen door deze back-up?'))return;db=x;db.drafts=db.drafts||{};supplier='';save();render();alert('Back-up teruggezet')}catch(err){alert('Back-up niet geldig: '+err.message)}}
async function scan(target){let box=document.getElementById('scanner');if(!('BarcodeDetector' in window)){alert('Barcode scannen wordt niet ondersteund in deze browser. Gebruik Chrome op Android of voer de barcode handmatig in.');return}try{stopCamera();box.innerHTML='<video id="camera" autoplay playsinline></video><div><button class="secondary" onclick="stopCamera()">Camera sluiten</button></div>';cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let video=document.getElementById('camera');video.srcObject=cameraStream;let detector=new BarcodeDetector();window.scanTimer=setInterval(async()=>{if(!cameraStream)return;try{let codes=await detector.detect(video);if(codes.length){let value=codes[0].rawValue;stopCamera();let inp=document.getElementById(target);if(inp){inp.value=value;inp.dispatchEvent(new Event('input'))}if(target==='search'){let p=db.products.find(p=>p.supplier===supplier&&p.barcode===value);if(p){qty(p.id,(Number(draft().quantities[p.id])||0)+1);alert(p.name+' toegevoegd (+1 CRT). Pas aantal aan indien nodig.')}else alert('Barcode niet gevonden bij deze leverancier.')}}}catch{}},350)}catch(e){stopCamera();alert('Camera niet beschikbaar: '+e.message)}}function stopCamera(){clearInterval(window.scanTimer);if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}let b=document.getElementById('scanner');if(b)b.innerHTML=''}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
